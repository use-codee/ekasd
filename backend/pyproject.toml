[project]
name = "wind-decision-api"
version = "0.1.0"
description = "Local API for historical wind forecast decisions"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.135.1",
  "httpx==0.28.1",
  "pandas>=3.1.0",
  "pydantic-settings==2.13.1",
  "uvicorn==0.41.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
